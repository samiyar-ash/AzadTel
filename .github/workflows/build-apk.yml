name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use custom icon if supplied
        shell: bash
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp icon.png app/src/main/res/drawable-nodpi/app_icon.png
            echo "Using root icon.png"
          else
            echo "icon.png not found; using the built-in default icon"
          fi

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzadTel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
